# Supabase project config so `supabase link --project-ref <ref> && supabase db push`
# works from a clean clone (the documented self-host path). project_id is the LOCAL
# name; the remote is chosen by `supabase link`. See docs/SELF_HOST.md.
project_id = "mnema-atlas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[storage]
enabled = true
# Mirrors the `uploads` bucket created in migration 0025.
file_size_limit = "50MiB"

[auth]
enabled = true
# A self-hoster sets these to their own deployed origin (and lists redirect URLs
# in the Supabase dashboard → Auth → URL Configuration). See docs/SELF_HOST.md.
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Google sign-in is the app's only login. Enable + configure it in the Supabase
# dashboard (Auth → Providers → Google) with your own OAuth client id/secret.
[auth.external.google]
enabled = false

[studio]
enabled = true
port = 54323
