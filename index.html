<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved theme before first paint so dark-mode users never see a
         white flash. Must mirror getInitial() in src/lib/theme.tsx exactly. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <style>
      /* First-paint shell: page colour + a branded loader before the bundle runs.
         Colours mirror --background/--foreground/--brand in src/index.css. */
      html { background-color: oklch(0.994 0.003 95); }
      html.dark { background-color: oklch(0.205 0.012 70); }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px;
        font-family: 'Lora', 'Noto Serif TC', Georgia, serif;
      }
      #boot .boot-dot { width: 9px; height: 9px; border-radius: 9999px; background: oklch(0.58 0.13 250); }
      html.dark #boot .boot-dot { background: oklch(0.72 0.12 250); }
      #boot .boot-word { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; color: oklch(0.27 0.012 60); }
      html.dark #boot .boot-word { color: oklch(0.92 0.008 85); }
      @media (prefers-reduced-motion: no-preference) {
        #boot .boot-dot { animation: boot-pulse 1.2s ease-in-out infinite; }
        @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.4); opacity: 1; } }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Mnema Atlas · 讀書筆記背誦閃卡</title>
    <!-- PWA: installable to the home screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#5b7cfa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mnema" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Lora:ital,wght@0,400..600;1,400..500&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount; keeps the first frame branded, never blank. -->
      <div id="boot" aria-hidden="true"><span class="boot-dot"></span><span class="boot-word">Mnema</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
