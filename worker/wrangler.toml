name = "mnema-atlas-worker"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# ── Public custom domain ─────────────────────────────────────────────
# dco.tw is on Cloudflare, so deploy auto-creates the DNS record + SSL cert.
# This is the URL external AIs connect to:  https://mnema-ai.dco.tw/{mcp,rest}
# NOTE: top-level keys (routes) MUST precede any [table] sections below.
#
# SELF-HOST: change `name` above to your own, then EITHER point this route at a
# domain on YOUR Cloudflare account, OR delete this whole `routes` block to use
# the free https://<name>.<your-subdomain>.workers.dev URL. Set VITE_MCP_URL /
# VITE_REST_URL (deploy.yml / repo Variables) to whichever you pick. See docs/SELF_HOST.md.
routes = [
  { pattern = "mnema-ai.dco.tw", custom_domain = true }
]

# ── Cron: scan for due Tempo reminders and send web-push (≤60s latency) ──
# DISABLED until the account has a workers.dev subdomain (Cloudflare dashboard →
# Workers & Pages → opens once to auto-create it). Registering a cron schedule
# requires it (API error 10063). After creating it, uncomment to enable push.
# [triggers]
# crons = ["* * * * *"]

# ── Public config (safe to commit) ──
# VAPID public key — the browser subscribes with it; the worker includes it when
# signing pushes. The PRIVATE key + subject are secrets (see below).
[vars]
VAPID_PUBLIC_KEY = "BJOIOxAJypzGgGZ4v_GsrrRAT2-gGwreLMbhrju_DxZ_2ZmvEunXKHmYuOGUrFI4TVKzY2RLBboN-O0Iy7sbJ38"
# Public base URL of this worker — the SW POSTs notification actions to {url}/_action.
WORKER_PUBLIC_URL = "https://mnema-ai.dco.tw"

# ── Secrets (server-only — NEVER commit) ─────────────────────────────
# Local dev: put them in worker/.dev.vars (see .dev.vars.example).
# Production:  wrangler secret put SUPABASE_URL
#              wrangler secret put SUPABASE_SECRET_KEY
#
# SUPABASE_URL         = https://YOUR-PROJECT.supabase.co
# SUPABASE_SECRET_KEY  = sb_secret_...   (service/secret key — bypasses RLS)

# ── Rate limiting (Workers Rate Limiting API) ────────────────────────
# Per-API-key for authed traffic; per-IP for keyless discovery. period ∈ {10,60}.
# Generous so a human + their AI agent never hit it; only floods/abuse do.
[[unsafe.bindings]]
name = "RL_KEY"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 600, period = 60 }

[[unsafe.bindings]]
name = "RL_IP"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 120, period = 60 }

# ── OAuth (Phase 3b — claude.ai connector) ───────────────────────────
# To accept the claude.ai web/desktop connector (OAuth 2.1 only), bind a KV
# namespace for the OAuth provider and wrap index.ts with
# @cloudflare/workers-oauth-provider. See README.
# [[kv_namespaces]]
# binding = "OAUTH_KV"
# id = "<your-kv-id>"
