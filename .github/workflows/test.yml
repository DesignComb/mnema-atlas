name: Tests

# Unit (Vitest) + public-surface E2E (Playwright) on every push to main and on PRs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright (builds + previews, then drives Chromium)
        env:
          VITE_SUPABASE_URL: https://enfiuplmzpsmfgrykmxg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_plbnYoh6H64YutUeTd8muA_lHXl00Vz
          VITE_MCP_URL: https://mnema-ai.dco.tw/mcp
          VITE_REST_URL: https://mnema-ai.dco.tw/rest
          # Optional: add these 3 repo secrets to also run the signed-in (authed) e2e
          # in CI. Without them, only the public-surface suite runs. SUPABASE_SECRET_KEY
          # is the service key (the auth fixture mints a session via an admin magic link).
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
