name: Deploy (Cloudflare)

# On every push to main: deploy the Worker (→ mnema-ai.dco.tw) and the frontend
# (→ Cloudflare Pages: mnema-atlas.pages.dev / mnema-atlas.dco.tw).
#
# ── One-time setup ───────────────────────────────────────────────────────────
# Add ONE GitHub Actions secret:  CLOUDFLARE_API_TOKEN
#   Cloudflare → My Profile → API Tokens → Create Custom Token:
#     • Account · Workers Scripts · Edit
#     • Account · Cloudflare Pages · Edit
#     • Account · Account Settings · Read
#   (owned by the account that holds dco.tw). Repo → Settings → Secrets → Actions.
#
# VITE_* below are client-side PUBLIC (publishable key + URLs), safe to commit.
# Worker secrets (SUPABASE_URL / SUPABASE_SECRET_KEY) live on the Worker already
# (wrangler secret put) and persist across deploys.
#
# We use `npm install` (not `npm ci`): the lockfile is generated on Windows and
# `npm ci`'s strict cross-platform tree check trips over Tailwind v4's optional
# WASM-runtime deps on Linux runners.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Forkers: override these via repo Variables (Settings → Secrets and variables →
# Actions → Variables) — CLOUDFLARE_ACCOUNT_ID, CF_PAGES_PROJECT, VITE_SUPABASE_URL,
# VITE_SUPABASE_PUBLISHABLE_KEY, VITE_MCP_URL, VITE_REST_URL. Unset → the defaults
# below (the maintainer's instance). Also edit worker/wrangler.toml (name + route).
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '95a418e79390090ee72a97d77fac66fe' }}

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # The Worker bundles ../shared/schemas.ts, which imports zod from the ROOT node_modules.
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: worker
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      # Server-only secrets that CI must keep in sync (persist across deploys, but
      # set here so a fresh account/worker is configured from the GitHub secret).
      # Add the secret in repo → Settings → Secrets → Actions. Skipped if unset.
      - name: Sync Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          else
            echo "OPENAI_API_KEY not set — skipping"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://enfiuplmzpsmfgrykmxg.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_plbnYoh6H64YutUeTd8muA_lHXl00Vz' }}
          VITE_MCP_URL: ${{ vars.VITE_MCP_URL || 'https://mnema-ai.dco.tw/mcp' }}
          VITE_REST_URL: ${{ vars.VITE_REST_URL || 'https://mnema-ai.dco.tw/rest' }}
        run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ vars.CF_PAGES_PROJECT || 'mnema-atlas' }} --branch main
